name: Build AutoFish Open APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Extract project
        run: |
          unzip -q AutoFishOpen_source_with_fish_icon.zip -d source

      - name: Check project files
        run: |
          echo "Checking Android project..."
          ls -la source
          test -f source/settings.gradle || test -f source/settings.gradle.kts
          test -d source/app

      - name: Build APK
        run: |
          gradle -p source :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoFishOpen-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
